name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: Typecheck & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test

  ui:
    name: Build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run build

  contract:
    name: Compile contracts & run circuit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Compact developer tools
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          # Expose the installed `compact` CLI to subsequent steps.
          echo "$HOME/.compact/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install toolchain (compiler 0.31.0)
        run: compact update 0.31.0
      - run: npm install
      - name: Compile contracts to ZK circuits
        run: npm run compact:build
      # These only run where the compiled contract exists, so they must live in
      # this job: they execute the real circuits and pin src/allowlist.mjs to
      # them. The `quality` job skips them on a bare checkout.
      - name: Circuit-level tests against the compiled contract
        run: node --test test/circuit.test.mjs
      - name: Upload compiled artifacts
        uses: actions/upload-artifact@v4
        with:
          name: umbra-managed
          path: contracts/managed/
          if-no-files-found: warn
